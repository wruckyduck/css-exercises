<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
    }
    
    .container {
        display: flex;
        width: 100%;
        align-items: stretch; /* ensures left and right sides match height */
    }
    
    .left-section {
        width: 50%;
        display: flex;
        align-items: stretch;
        justify-content: center;
        background: #f8f9fa;
        overflow: hidden;
    }
    
    .profile-image {
        width: 100%;
        height: 100%;
        background-image: url('harrywruck.png');
        background-size: cover;
        background-position: center;
        border-radius: 8px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    
    .right-section {
        width: 50%;
        padding: 80px 60px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        overflow-y: auto;
        background: #f8f9fa;
    }
    
    .content-wrapper {
        max-width: 520px;
        width: 100%;
    }
    
    .name {
        font-size: 42px;
        font-weight: 700;
        color: #222;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
    }
    
    .birth-year {
        font-size: 16px;
        color: #777;
        margin-bottom: 40px;
    }
    
    .bio-section {
        margin-bottom: 40px;
    }
    
    .bio-text {
        font-size: 16px;
        line-height: 1.7;
        margin-bottom: 16px;
        color: #444;
    }
    
    .highlight {
        font-weight: 600;
        color: #111;
    }
    
    .writing-list {
        list-style: none;
        margin-bottom: 32px;
    }
    
    .writing-list li {
        font-size: 15px;
        color: #555;
        margin-bottom: 6px;
        font-style: italic;
    }
    
    .writing-list a {
        color: #555;
        text-decoration: none;
    }
    
    .writing-list a:hover {
        color: #111;
        transition: color 0.2s ease;
    }
    
    .praxis-section {
        margin: 32px 0;
        font-size: 15px;
        color: #444;
    }
    
    .contact-section {
        margin-top: 40px;
    }
    
    .email {
        font-size: 15px;
        color: #111;
        text-decoration: none;
        margin-bottom: 12px;
        display: block;
    }
    
    .email:hover {
        text-decoration: underline;
    }
    
    .social-links {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
    }
    
    .social-links a {
        color: #555;
        text-decoration: none;
        font-size: 14px;
    }
    
    .social-links a:hover {
        color: #111;
        transition: color 0.2s ease;
    }
    
    .location {
        font-size: 13px;
        color: #777;
        letter-spacing: 0.5px;
    }
    
    @media (max-width: 768px) {
        .container {
            flex-direction: column;
        }
        
        .left-section, .right-section {
            width: 100%;
        }
        
        .left-section {
            min-height: 400px;
        }
        
        .right-section {
            padding: 40px 30px;
        }
        
        .name {
            font-size: 32px;
        }
    }
</style>
